DESIGN_NAME: "cnn_top"

VERILOG_FILES:
  - "dir::src/mac_unit.v"
  - "dir::src/mem.v"
  - "dir::src/cnn_top_0825.v"

# Clock Setup
CLOCK_PORT: "clk"
CLOCK_PERIOD: 6.85

# Placement & Layout
FP_CORE_UTIL: 40
PL_TARGET_DENSITY_PCT: 45

FP_PIN_ORDER_CFG: dir::pin_order.cfg

#electrical constraint
MAX_FANOUT_CONSTRAINT: 20
MAX_TRANSITION_CONSTRAINT: 1.2
MAX_CAPACITANCE_CONSTRAINT: 0.25

#antenna repair
RUN_HEURISTIC_DIODE_INSERTION: true
GRT_ANTENNA_MARGIN: 20  #increased from 10
GRT_ANTENNA_ITERS: 20
HEURISTIC_ANTENNA_THRESHOLD: 180
DIODE_PADDING: 2

# Fanout & Slew Margin Repair
RUN_POST_GPL_DESIGN_REPAIR: true
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_CTS_RESIZER_TIMING: true
RUN_POST_GRT_RESIZER_TIMING: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 10

#syth strategy
SYNTH_STRATEGY: "DELAY 3"

# PDK Setup
PDK: "sky130A"
STD_CELL_LIBRARY: "sky130_fd_sc_hd"
