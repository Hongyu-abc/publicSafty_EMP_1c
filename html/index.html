<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sweet Scoops Ice Cream</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div>
        <img src="images/logo.png" id="logo"/>
        <h2>Sweet Scoops Ice Cream</h2>
      </div>
      <nav>
          <a href="index.html" class="active">Home</a>
          <a href="flavors.html">Our Flavors</a>
          <a href="about.html">About Us</a>
      </nav>
    </header>

    <main>
      <section class="banner">
        <video src="videos/landing1.mp4" id="video" autoplay muted loop></video>
        <div id="overlay">
          <h2>Indulge in our tasty frozen desserts</h2>
          <a href="about.html" id="overlay-button">View Our Pricing</a>
        </div>
      </section>
      <h1>Our Top Flavors</h1>
      <section class="info">
        
        <div class="info-item">
          <img src="images/vanilla-chocolate.png"  class="info-image" />
          <h2>Vanilla Chocolate</h2>
        </div>
        <div class="info-item">
          <img src="images/pistachio-chocolate.png"  class="info-image" />
          <h2>Pistachio Chocolate</h2>
        </div>
        <div class="info-item">
          <img src="images/chocolate-caramel.png"  class="info-image" />
          <h2>Chocolate Caramel</h2>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Developed by CodeWizardsHQ</p>
    </footer>
